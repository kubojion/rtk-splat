# Hangar -> field drive, 2026-07-03, 0.6 m/s. Two simultaneously recorded
# bags: camera bag (ZED laptop, Buffalo SSD) + robot bag (full ublox topics).
# Doubles as the wind-free control experiment (rigid structures, road).

paths:
  bags:
    - "/media/jion_kubo/Buffalo SSD/0703/zed2i_vislam_rtk_hd1080_compressed_20260703_095124"
    - ~/Desktop/FIELD-TEST-0703/bags-misc/hanger2filed1-nav2-2
  ublox_msgs_dir: ~/agrorob_ws/src/ublox_dgnss/ublox_ubx_msgs/msg
  workdir: ~/agromap4d_work/hangar

topics:
  left_image: /zed/zed_node/left/color/rect/image/compressed
  right_image: /zed/zed_node/right/color/rect/image/compressed
  left_info: /zed/zed_node/left/color/rect/camera_info
  right_info: /zed/zed_node/right/color/rect/camera_info
  fix: /ublox_moving_base/fix                # robot bag
  relpos: /ublox_rover/ubx_nav_rel_pos_ned   # robot bag
  imu: /zed/zed_node/imu/data                # camera bag

pose:
  source: rtk_dual_antenna
  trajectory_file: ""
  clockcheck_topic: /gps/fix    # recorded by BOTH machines -> offset estimate
  time_offset_s: 0.10           # clockcheck 2026-07-24: C1=+120ms (corr .72), C0<=+79ms; 0.10 = compromise, +-40ms residual = +-2.4cm at 0.6 m/s
  antenna_forward_m: 0.32
  min_carr_soln: 2
  yaw_smooth_window: 5
  cam_forward_m: 3.18
  cam_left_m: 0.0
  cam_up_m: 1.31
  pitch_down_deg: 20.17
  yaw_offset_deg: -1.40
  center_up_m: 0.015
  left_eye_forward_m: -0.010
  left_eye_left_m: 0.060
  baseline_m: 0.1198462504
  use_imu_tilt: false           # A/B later; keep first run comparable
  imu_lp_window_s: 1.0

segment:
  search_t_start_s: 230.0      # ~1/3 in: skip the featureless parking lot (user)
  heading_std_max_deg: 4.0      # the route curves; accept gentle arcs
  speed_range_ms: [0.3, 1.0]
  length_s: 50.0                # ~30 m at 0.6 m/s
  frame_stride: 1               # 15 Hz -> ~4 cm spacing at this speed

depth:
  backend: sgbm
  min_z_m: 1.5
  max_z_m: 15.0                 # rigid structures are farther than crop canopy
  sgbm:
    num_disparities: 128
    block_size: 5
    uniqueness_ratio: 10
    speckle_window: 100
    speckle_range: 2

cloud:
  pixel_stride: 6
  voxel_m: 0.02
  max_points: 4000000

train:
  run_name: tile_hangar4
  max_gaussians: 1500000
  iterations: 30000
  ssim_lambda: 0.2
  depth_lambda: 0.1
  opacity_reg: 0.01
  scale_reg: 0.01
  holdout_every: 8
  eval_every: 1000
  sh_degree: 1
  init_opacity: 0.1
  init_scale_mult: 1.5
  mask_dilate_px: 25
  min_scale_m: 0.001
  max_scale_m: 0.20
  max_anisotropy: 8.0
  export_prune_opacity: 0.05
  export_crop: true             # crop viewer PLY to the supervised core (kills periphery mush)
  rasterize_mode: antialiased   # gsplat AA rasterization
  refine_stop_frac: 0.8         # MCMC relocation stops here; final 20% = settle phase
  means_lr_final_mult: 0.01     # position-lr decay depth over the run (audit: 0.01 may freeze
                                # positions too early on metric scenes; A/B arm = 0.1)
  color_finetune_frac: 0.0      # last fraction: freeze geometry, train colors only (0 = off)
  # camera-side refinement (session-3): bounded pose polish + exposure
  use_right_camera: false       # A/B 2026-07-24: no measured gain (bundled with pose_opt test)
  pose_opt:
    enabled: false              # A/B 2026-07-24: aligned 22.10 vs 22.15 without -- test-time
                                # alignment recovers everything training-time refinement buys.
                                # Module kept: generic feature + eval-alignment uses it.
    start_iter: 1000            # let the map settle first
    lr: 1.0e-4                  # splatfacto value; eps=1e-15 in code (load-bearing)
    weight_decay: 1.0e-6
    max_trans_m: 0.03           # hard tanh bound = RTK trust radius
    max_rot_deg: 0.5
    trans_penalty: 1.0e-2       # nerfstudio-style pull toward zero inside the bounds
    rot_penalty: 1.0e-3
  exposure_opt:
    enabled: true               # re-enabled WITH mean-zero gauge projection (2026-07-24
                                # overnight): documented cloud-driven lighting changes are
                                # exactly what this compensates; global tint now projected out
    lr: 1.0e-3
    weight_decay: 1.0e-4
  eval_pose_align_steps: 200    # final-eval test-time alignment (CF-3DGS protocol)
  eval_pose_align_lr: 2.0e-3
  lr:
    means: 1.6e-4
    scales: 5.0e-3
    quats: 1.0e-3
    opacities: 5.0e-2
    sh0: 2.5e-3
    shN: 1.25e-4
