# Headland-turn experiment: end of row 5 -> U-turn -> entry of row 1.
# 184 deg heading sweep at <3 deg/s, 100% RTK-fixed, formal heading sigma 0.41 deg
# (pre-run check 2026-07-26). Tests whether directly measured dual-antenna
# heading survives rotation -- the regime where the AgriGS demo's VIO-chain
# poses collapsed. Uses an explicit window and a dedicated work directory.

paths:
  # Camera and GNSS topics may be in different simultaneous bags. The current
  # adapter requires the left/right image topics to share one camera bag.
  bags:
    - ~/Desktop/FIELD-TEST-0703/bags-field1-nav2/0703-nav2-follow-field1-row3-6-2-5-1-4-raw-localization-inputs-zed
  ublox_msgs_dir: ~/agrorob_ws/src/ublox_dgnss/ublox_ubx_msgs/msg   # read-only; only needed by the rtk_dual_antenna source
  workdir: ~/agromap4d_work/field_turn

topics:
  left_image: /zed/zed_node/left/color/rect/image/compressed
  right_image: /zed/zed_node/right/color/rect/image/compressed
  left_info: /zed/zed_node/left/color/rect/camera_info
  right_info: /zed/zed_node/right/color/rect/camera_info
  fix: /ublox_moving_base/fix                # position antenna (matches validated crop-row pipeline)
  relpos: /ublox_rover/ubx_nav_rel_pos_ned   # dual-antenna heading (rtk_dual_antenna source only)
  imu: /zed/zed_node/imu/data                # fused orientation (tilt correction, optional)

pose:
  # Immutable pose selection. "rtk" keeps the original experiment; the
  # stereo-BA reproduction script overrides this with a named sidecar.
  artifact: rtk
  # Pose source:
  #   rtk_dual_antenna -- GNSS fix + dual-antenna heading topic (this robot)
  #   gnss_course      -- GNSS fix only; yaw from the smoothed track direction
  #   trajectory_file  -- poses from a TUM-format file (t x y z qx qy qz qw)
  source: rtk_dual_antenna
  trajectory_file: ""           # used only by the trajectory_file source
  clockcheck_topic: /gps/fix    # topic recorded by both machines (clockcheck stage)
  time_offset_s: 0.0            # added to IMAGE stamps (cross-machine clock offset; see `clockcheck`)
  # Conventions replicated from the validated crop-row pipeline (2-4 cm RMS):
  # WGS84 local ENU from first fix; yaw = atan2(n, e) of moving_base->rover.
  antenna_forward_m: 0.32       # moving-base antenna ahead of rear-axle base_link
  min_carr_soln: 2              # both bracketing relpos samples must be RTK-fixed
  yaw_smooth_window: 5          # ~1 s at 5 Hz, same as crop-row node
  # Optional per-frame roll/pitch from the (fused) IMU orientation: statics are
  # removed (median-subtracted), only low-passed dynamics are applied, so bad
  # conventions cannot silently rotate the map. Accept only if the acceptance
  # test (ground-plane residual + held-out PSNR) improves.
  use_imu_tilt: false          # A/B 2026-07-24: no effect (21.76 vs 21.79 masked) -- roll is NOT the softness bottleneck; keep available for bumpier segments
  imu_lp_window_s: 1.0
  # base_link -> camera mount (CAR mode; calibrated 2026-07-10 mosaic study)
  cam_forward_m: 3.18
  cam_left_m: 0.0
  cam_up_m: 1.31
  pitch_down_deg: 20.17         # 24.5 nominal - 4.33 calibrated
  yaw_offset_deg: -1.40         # calibrated
  # ZED internal offsets (July 3 bag TF), applied in the mount frame
  center_up_m: 0.015
  left_eye_forward_m: -0.010
  left_eye_left_m: 0.060
  baseline_m: 0.1198462504      # left -> right eye separation

segment:
  # Selected by `rtk-splat select` and written into segment_meta.json.
  # A straight in-row window is found automatically; these bound the search.
  # Explicit window (bypasses the straightness search; RTK gate still applies):
  # ~170 s straight row-5 end, ~145 s U-turn (2920-3065), ~135 s row-1 entry.
  window_s: [2750.0, 3200.0]
  search_t_start_s: 120.0       # unused with window_s set
  heading_std_max_deg: 2.0
  speed_range_ms: [0.05, 0.2]   # in-row driving; rejects parked robot and headland turns
  length_s: 200.0               # 20 m at 0.1 m/s
  frame_stride: 5               # every 5th frame -> 3 Hz, ~2 cm spacing

depth:
  backend: sgbm                 # the only built-in depth backend
  min_z_m: 1.5
  max_z_m: 12.0
  sgbm:
    num_disparities: 128        # covers z > ~1.05 m at fx*B = 134 px*m
    block_size: 5
    uniqueness_ratio: 10
    speckle_window: 100
    speckle_range: 2

cloud:
  pixel_stride: 6               # back-project every Nth pixel
  voxel_m: 0.02
  max_points: 4000000

colmap:
  # Calibrated stereo visual BA sidecar. COLMAP is never invoked by `all`;
  # prepare/solve/export are explicit stages. COLMAP_BIN can override this.
  executable: colmap
  max_image_size: -1
  max_num_features: 8192
  feature_num_threads: 8       # covariant DSP-SIFT is CPU; bound RAM on 30 GiB host
  sequential_overlap: 10
  alignment_max_error_m: 0.15
  alignment_ransac_iterations: 5000
  min_registered_fraction: 0.95
  scale_range: [0.98, 1.02]

# Isolated, mapper-neutral backend. It reuses a sealed stereo frontend and
# copies that database before COLMAP opens it. Always use a new artifact name
# when any setting changes; old plans are intentionally not resumed.
mapper:
  name: headland-global-bounded-v1
  pose_artifact_name: headland-global-bounded-v1
  backend: global
  num_threads: 8
  random_seed: 7
  ba_num_iterations: 3
  # Measured reduced profile for this 30 GiB/no-swap workstation. The initial
  # full-track attempt is preserved as colmap_global_headland_v1: Ceres reached
  # 15.7 GiB RSS and the safety monitor stopped it below 4 GiB MemAvailable.
  # The successful incremental model predicts that the 1000/view target stops
  # after ~53,866 longest tracks (~6.91 M observations, versus 18.21 M), while
  # the 60k ceiling bounds adverse datasets. The core knobs remain generic.
  keep_max_num_tracks: 60000
  track_required_tracks_per_view: 1000
  # COLMAP retriangulation deletes the capped tracks and rebuilds from the full
  # correspondence graph, defeating the memory bound. Stereo depth builds the
  # GS initialization independently, so it is intentionally disabled here.
  skip_retriangulation: true
  # Keep both global positioning and bundle adjustment on CPU. This is the
  # exact successful reduced-profile choice; the GPU remains free for later GS.
  gp_use_gpu: false
  ba_ceres_use_gpu: false
  # Keep the desktop responsive and stop before the no-swap host reaches OOM.
  process_nice: 10
  resource_sample_interval_s: 2.0
  minimum_available_memory_gb: 4.0
  low_memory_consecutive_samples: 2
  minimum_free_space_gb: 15.0
  minimum_runtime_free_space_gb: 5.0
  # Current held-out quality semantics. Do not revive the legacy 1.0 px gate:
  # the accepted golden global reconstruction measured about 1.335 px.
  max_reprojection_error_px: 2.0
  min_mean_track_length: 2.0
  alignment_ransac_threshold_m: 0.15
  alignment_ransac_iterations: 5000
  alignment_temporal_blocks: 5
  # Read-only held-out replay of the accepted 2688-image golden model using
  # this frontend's exact 1344 priors/covariances (5 temporal blocks, seed 7):
  # median 0.0989165 m, inlier p95 0.1208889 m, inlier fraction 1.0.
  # These limits reproduce that result while rejecting systematic >12 cm
  # disagreement, a >15 cm inlier tail, or more than 5% covariance outliers.
  max_rtk_median_error_m: 0.12
  max_rtk_p95_inlier_error_m: 0.15
  min_rtk_inlier_fraction: 0.95

# Historical, diagnostic-only calibration sidecar configuration. No current
# contract-v2 CLI exposes `integrity-audit`; normal cloud and train stages
# ignore this section. Its output lives under calibration_artifacts, never
# under pose_artifacts, and cannot overwrite an existing name.
calibration:
  source_pose_artifact: colmap_stereo
  output_artifact: rtk_stereo_metric_integrity_v2_strict
  moving_base_pvt_topic: /ublox_moving_base/ubx_nav_pvt
  log_time_margin_s: 5.0
  status_max_age_s: 0.15
  minimum_navsat_status: 1
  minimum_position_carrier_solution: 2
  minimum_baseline_carrier_solution: 2
  baseline_length_tolerance_fraction: 0.03

  physical_geometry:
    # Every quantity below is a rough, user-supplied physical prior. These
    # frames and the complete primary->secondary vector are explicit so this
    # sidecar can be configured for a different robot without hidden offsets.
    body_frame: car_rear_axle
    camera_frame: zed_left_optical
    primary_antenna_frame: gps_moving_base_phase_center
    secondary_antenna_frame: gps_rover_phase_center
    # T_body_camera for the left optical centre. This uses the physical
    # +0.130281 deg mapper yaw, not pose.yaw_offset_deg=-1.40 deg: the latter
    # already represented heading in the tilted antenna-baseline frame.
    body_from_left_camera:
      translation_m: [3.175648945101844, 0.059990261493772, 1.327528172956190]
      quaternion_xyzw: [-0.580487861584949, 0.579169423828511, -0.404259644044676, 0.405179912201426]
    primary_antenna_position_body_m: [0.320, 0.000, 0.000]
    secondary_antenna_position_body_m: [1.705, 0.037, 0.000]

  optimization:
    # GNSS header time = camera header time + clock offset. Header and MCAP
    # log nanoseconds plus u-blox iTOW are all retained in the artifact.
    initial_clock_offset_s: 0.0
    clock_offset_bounds_s: [-0.25, 0.25]
    lever_correction_bounds_m: [0.30, 0.30, 0.30]
    baseline_angle_correction_bounds_deg: [8.0, 8.0]
    lever_prior_sigma_m: [0.10, 0.10, 0.10]
    baseline_angle_prior_sigma_deg: [3.0, 3.0]
    clock_prior_sigma_s: 0.10
    position_sigma_floor_m: 0.03
    baseline_sigma_floor_m: 0.01
    sample_interval_s: 1.0
    temporal_blocks: 10
    holdout_block_stride: 5
    holdout_block_offset: 2
    robust_loss: soft_l1
    robust_f_scale: 1.0
    max_nfev: 250
    clock_grid_steps: 21
    minimum_std_reduction: 0.20
    maximum_bound_fraction: 0.90
    maximum_start_std_prior_fraction: 0.35
    maximum_fold_std_prior_fraction: 0.50
    minimum_correction_to_fold_std_ratio: 2.0
    maximum_heldout_regression_fraction: 0.02
    maximum_heldout_position_rms_regression_fraction: 0.02
    maximum_heldout_position_p95_regression_fraction: 0.05
    minimum_heldout_improvement_fraction: 0.005
    minimum_heldout_baseline_improvement_fraction: 0.005

train:
  run_name: tile_turn2
  seed: 0                       # seeds NumPy/Torch initialization and MCMC RNG
  max_gaussians: 2500000       # budget A/B vs turn1 (1.5M); probe 2026-07-27: 3.4M peaks 2.2 GB in-step, ample 8 GB headroom
  iterations: 65000            # epoch parity with tile_e7 (1176 frames x ~57)
  ssim_lambda: 0.2
  depth_lambda: 0.1
  opacity_reg: 0.01             # MCMC-paper regularizers (upstream preset values)
  scale_reg: 0.01
  holdout_every: 8              # every 8th frame is held out for eval
  eval_every: 2000
  sh_degree: 1                  # forward-only capture cannot constrain SH3; 1 kills view-dependent "fireworks"
  init_opacity: 0.1
  init_scale_mult: 1.5          # x voxel size
  # supervision mask: photometric loss only where the (dilated) stereo depth is
  # valid -- large invalid regions (sky, far field) are never supervised, so no
  # junk Gaussians get planted along their rays. Purely geometric, no horizon
  # or sky-detector assumptions.
  mask_dilate_px: 25
  # anti-needle constraints, applied as hard projections after each step
  min_scale_m: 0.001
  max_scale_m: 0.20
  max_anisotropy: 8.0           # max axis ratio within one Gaussian
  export_prune_opacity: 0.05
  export_crop: true             # crop viewer PLY to the supervised core (kills periphery mush)
  rasterize_mode: antialiased   # gsplat AA rasterization
  refine_stop_frac: 0.8         # MCMC relocation stops here; final 20% = settle phase
  means_lr_final_mult: 0.1      # A/B arm vs e5 (0.01): milder position freeze (audit: 0.01 may freeze
                                # positions too early on metric scenes; A/B arm = 0.1)
  color_finetune_frac: 0.0      # last fraction: freeze geometry, train colors only (0 = off)    # viewer PLY: drop near-invisible Gaussians
  # camera-side refinement (session-3): bounded pose polish + exposure
  use_right_camera: false       # A/B 2026-07-24: no measured gain (bundled with pose_opt test)
  pose_opt:
    enabled: false              # A/B 2026-07-24: aligned 22.10 vs 22.15 without -- test-time
                                # alignment recovers everything training-time refinement buys.
                                # Module kept: generic feature + eval-alignment uses it.
    start_iter: 1000            # let the map settle first
    lr: 1.0e-4                  # splatfacto value; eps=1e-15 in code (load-bearing)
    weight_decay: 1.0e-6
    max_trans_m: 0.03           # hard tanh bound = RTK trust radius
    max_rot_deg: 0.5
    trans_penalty: 1.0e-2       # nerfstudio-style pull toward zero inside the bounds
    rot_penalty: 1.0e-3
  exposure_opt:
    enabled: true               # re-enabled WITH mean-zero gauge projection (2026-07-24
                                # overnight): documented cloud-driven lighting changes are
                                # exactly what this compensates; global tint now projected out
    lr: 1.0e-3
    weight_decay: 1.0e-4
  eval_pose_align_steps: 200    # final-eval test-time alignment (CF-3DGS protocol)
  eval_pose_align_lr: 2.0e-3
  lr:
    means: 1.6e-4
    scales: 5.0e-3
    quats: 1.0e-3
    opacities: 5.0e-2
    sh0: 2.5e-3
    shN: 1.25e-4
